services:
  - type: web
    name: pleiades
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_BACKEND
        value: auto
      - key: LLAMA_API_BASE
        sync: false
      - key: LLAMA_API_KEY
        sync: false
      - key: LLAMA_API_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TRUST_PROXY
        value: "1"
