line-length = 110
target-version = "py313"
extend-exclude = ["training/build", "frontend", "extra_frontend", ".venv"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[lint.per-file-ignores]
"tests/*" = ["E402"]
"eval/run_eval.py" = ["E402"]
"eval/run_answers.py" = ["E402"]
"training/product_data.py" = ["E402"]
"src/app.py" = ["E402"]
"api/main.py" = ["E402"]
